# Generated by cargo xtask vector-vendored-branch. Do not hand-edit.
name: Vendored Linux vector
on:
  push:
    branches:
      - "vendored/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      VECTOR_FEATURES: "sources-file,sources-internal_logs,sources-internal_metrics,sources-syslog,transforms-remap,transforms-throttle,transforms-reduce,transforms-route,sinks-http,sinks-file,sinks-console,sinks-blackhole,enrichment-tables-memory,vrl-functions-crypto,vrl-functions-env,vrl-functions-system"
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
      - name: Install pinned protoc
        run: |
          set -euo pipefail
          ver="25.3"
          url="https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip"
          expected="f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80"
          zip="$RUNNER_TEMP/protoc-${ver}.zip"
          root="$RUNNER_TEMP/protoc-${ver}"
          curl -sSfL "$url" -o "$zip"
          actual="$(sha256sum "$zip" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "protoc archive sha256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          rm -rf "$root"
          mkdir -p "$root"
          unzip -q "$zip" -d "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "PROTOC=$root/bin/protoc" >> "$GITHUB_ENV"
          "$root/bin/protoc" --version
      - name: Build release
        run: cargo build --release --locked --no-default-features --features "$VECTOR_FEATURES"
      - name: Pack tarball
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short="$(git rev-parse --short HEAD)"
          mkdir -p pack
          cp target/release/vector pack/vector
          tar -C pack -czf "vector-${commit}-x86_64-unknown-linux-gnu.tar.gz" vector
          sha256sum "vector-${commit}-x86_64-unknown-linux-gnu.tar.gz" > SHA256SUMS
          echo "RELEASE_TAG=vendored-${short}" >> "$GITHUB_ENV"
          echo "TARBALL=vector-${commit}-x86_64-unknown-linux-gnu.tar.gz" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" "$TARBALL" SHA256SUMS \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TAG" \
            --notes "Vendored vector ${{ github.sha }} for SparkLogs pack CI."
